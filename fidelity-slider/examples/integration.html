<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fidelity Slider integration</title>
    <style>
      /* A plain host interface with its own typeface and palette. */
      :root {
        --bg: #faf8f5;
        --ink: #2b2825;
        --muted: #8a837b;
        --line: #e4ded6;

        /* Fidelity Slider tokens: inherit the host's typeface and match its canvas. */
        --fs-font-family: inherit;
        --fs-canvas: #faf8f5;
        --fs-block: #eee9e2;
        --fs-block-line: #e0d9d0;
        --fs-block-radius: 8px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          15px/1.5 Georgia,
          "Iowan Old Style",
          serif;
        color: var(--ink);
        background: var(--bg);
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 24px;
        border-bottom: 1px solid var(--line);
      }
      .layout {
        display: grid;
        grid-template-columns: 200px 1fr;
        gap: 32px;
        padding: 32px 24px;
        max-width: 1000px;
        margin: 0 auto;
      }
      nav a {
        display: block;
        padding: 6px 0;
        color: var(--muted);
        text-decoration: none;
      }
      nav a[aria-current] {
        color: var(--ink);
      }
      section {
        display: grid;
        gap: 16px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        padding: 16px 0;
        border-bottom: 1px solid var(--line);
      }
      .row span {
        color: var(--muted);
      }
      .scrim {
        position: fixed;
        inset: 0;
        background: rgba(43, 40, 37, 0.32);
        display: grid;
        place-items: center;
        padding: 16px;
      }
      .dialog {
        width: min(440px, 100%);
        background: #fff;
        border-radius: 10px;
        padding: 24px;
        display: grid;
        gap: 16px;
      }
      .dialog h2 {
        margin: 0;
        font-size: 20px;
      }
      .dialog p {
        margin: 0;
        color: var(--muted);
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      button {
        font: inherit;
        padding: 8px 14px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: #fff;
        cursor: pointer;
      }
      button.primary {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }
      @media (max-width: 640px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Hearth</strong>
      <span>Account</span>
    </header>
    <div class="layout">
      <nav aria-label="Settings">
        <a href="#" aria-current="page">Profile</a>
        <a href="#">Notifications</a>
        <a href="#">Billing</a>
      </nav>
      <section>
        <h1>Profile</h1>
        <div class="row">Display name <span>Ada Vance</span></div>
        <div class="row">Email <span>ada@example.com</span></div>
        <div class="row">Time zone <span>UTC&minus;5</span></div>
      </section>
    </div>

    <!-- The design being evaluated: a confirmation dialog over the page. -->
    <div class="scrim">
      <div
        class="dialog"
        role="dialog"
        aria-labelledby="dlg-title"
        aria-modal="false"
      >
        <h2 id="dlg-title">Delete this account?</h2>
        <p>
          Your stories and drafts are kept for 30 days, then removed for good.
        </p>
        <div class="actions">
          <button type="button">Cancel</button
          ><button type="button" class="primary">Delete account</button>
        </div>
      </div>
    </div>

    <!-- Configure before the script loads (works the same as data- attributes). -->
    <script>
      window.FidelitySlider = {
        focus: ".dialog",
        keep: "header",
        level: "muted",
        ui: "on",
        url: "off",
        label: "Context",
      };
    </script>
    <script src="../src/fidelity-slider.js"></script>
  </body>
</html>
